# מחזיק את פרויקט Supabase ער.
#
# למה זה קיים: השכבה החינמית של Supabase משהה פרויקט אחרי כשבוע בלי
# פעילות. הכתובת החיה נשלחת למגייסים, והם עשויים לפתוח אותה שבועיים
# אחרי שקיבלו אותה — האתר ייטען יפה וההתחברות תיכשל, כי המסד ישן.
# הם לא ידעו שצריך להעיר אותו, והם יסיקו שהפרויקט לא עובד.
#
# הפתרון: בקשה אחת כל שלושה ימים. זה נחשב פעילות ומאפס את השעון.
#
# מגבלה שכדאי להכיר: GitHub משבית workflows מתוזמנים בריפו שאין בו שום
# פעילות במשך 60 יום, ושולח מייל לפני כן. אם תפסיק לגעת בריפו לחלוטין,
# צריך יהיה להפעיל אותו מחדש מלשונית Actions.

name: keepalive

on:
  schedule:
    # 06:00 UTC, כל שלושה ימים. חלון ההשהיה הוא כשבוע, אז יש מרווח נוח
    # גם אם הרצה אחת מתפספסת — GitHub לא מבטיח דיוק בתזמון.
    - cron: '0 6 */3 * *'
  # מאפשר להריץ ידנית מלשונית Actions, כדי לבדוק שההגדרה נכונה
  # בלי לחכות שלושה ימים.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: בקשה ל-Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::חסרים הסודות SUPABASE_URL או SUPABASE_ANON_KEY בהגדרות הריפו."
            exit 1
          fi

          # שאילתה אמיתית על טבלה, ולא בדיקת "בריאות": היא עוברת דרך
          # PostgREST ומגיעה ל-Postgres, ולכן נחשבת פעילות. בקשה
          # שנעצרת בשכבה שלפני המסד לא בהכרח מאפסת את שעון ההשהיה.
          #
          # התשובה הצפויה היא 200 עם מערך ריק: RLS על addresses מתיר
          # קריאה למשתמש מחובר בלבד, והבקשה הזו אנונימית. הריקנות היא
          # התנהגות נכונה — ואם תרצו, בדיקה שה-RLS באמת אוכף.
          #
          # שימו לב ש-/rest/v1/ בלי טבלה מחזיר 401 ולא 200. אל תחליפו
          # לשם — הוא ייכשל.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/addresses?select=address_id&limit=1")

          echo "HTTP ${status}"

          # נכשל ברעש ולא בשקט: workflow שמצליח תמיד אינו מנטר כלום.
          # אם המפתח הוחלף או הפרויקט נמחק, נדע מכאן.
          if [ "${status}" != "200" ]; then
            echo "::error::Supabase החזיר ${status} במקום 200. בדוק את הסודות ואת מצב הפרויקט."
            exit 1
          fi

          echo "הפרויקט ער."
